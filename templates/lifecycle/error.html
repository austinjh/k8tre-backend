{% block title %}Lifecycle error{% endblock %}
{% block content %}
<div class="alert alert-danger" role="alert">

  <pre class="mb-0">{{ error }}</pre>
</div>
<a href="/lifecycle" class="btn btn-outline-secondary">Back to lifecycle overview</a>
{% endblock %}
